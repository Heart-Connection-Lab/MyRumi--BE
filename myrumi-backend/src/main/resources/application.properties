spring.application.name=myrumi-backend


# JWT 설정
jwt.secret=myrumi-secret-key-2025-for-jwt-token-must-be-at-least-32-characters-long-for-hs256
jwt.access-token-validity-in-seconds=3600
jwt.refresh-token-validity-in-seconds=604800


# DB 설정

spring.datasource.url=jdbc:mysql://localhost:3306/myrumi?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=0425


#JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true


#Swagger 설정
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true